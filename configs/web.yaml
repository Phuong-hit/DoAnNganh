# Cấu hình giao diện web. Ghi đè khi chạy: python run_web.py --set source.target_fps=15 --set pose.conf=0.3
# Mọi đường dẫn tương đối tính từ thư mục gốc project.

paths:
  videos: data/videos            # chứa fall/ và adl/
  metadata: data/metadata.csv    # sinh bởi nút "Quét video" (hoặc python run_web.py scan)
  output: output                 # kết quả: output/<cấu hình>/csv/<video_id>.csv

source:
  target_fps: 10                 # FileSource / StreamSource lấy mẫu về FPS này (quy ước nhóm: 10)

pose:
  backend: yolo                  # yolo (YoloBackend của src/pose_estimate.py) | dummy (pose giả để test, không cần model)
  model_path: model_yolo/yolo11n_pose_f11_best_v5.pt   # giống main.py nhánh final (có thêm bản v6: model_yolo/yolo11n_pose_f11_best_v6.pt)
  conf: 0.25                     # ngưỡng phát hiện người (nhánh final: 0.25; trước đây 0.4)
  device: null                   # null = để ultralytics tự chọn | cpu | cuda:0
  kp_conf: 0.25                  # PoseEstimate: ngưỡng khớp tin cậy (nhánh final: 0.25; trước đây 0.35)
  min_valid_joints: 5            # PoseEstimate: ít hơn -> valid = False
  track_iou: 0.1
  lost_reset_frames: 30
  iou: 0.5                       # NMS IoU của YOLO
  use_tracker: true              # true: model.track() + ByteTrack giữ track_id qua khung | false: predict()
  tracker: bytetrack.yaml        # hoặc botsort.yaml
  imgsz: [224, 320]              # nhánh final: (cao 224, rộng 320) | null = 640 mặc định

filter:
  enabled: true                  # USE_FILTER: chạy SkeletonFilter trước khi ghi CSV / vẽ
  alpha: 0.5                     # (giữ cho tương thích; làm mượt giờ dùng One Euro bên dưới)
  min_conf: 0.25                 # nhánh final: SkeletonFilter(min_conf=0.25); trước đây 0.35
  max_hold_frames: 5
  history_size: 3
  jump_ratio: 0.65
  min_jump: 0.04
  max_bone_ratio: 2.5
  collapse_ratio: 0.5
  max_gap_frames: 15
  min_cutoff: 1.5                # One Euro: nhỏ hơn = mượt hơn khi đứng yên
  beta: 4.0                      # One Euro: lớn hơn = bám nhanh hơn khi chuyển động (ngã)
  smooth_bbox: true
  default_dt: 0.1                # dt dùng khi t không tăng

draw:
  min_conf: 0.35                 # SkeletonDraw + lớp vẽ trên trình phát
  show_bbox: true                # hộp bao + "person <score>" trên luồng trực tiếp
  show_score: true
  show_kp_conf: false            # in conf từng khớp

check:                           # tham số kiểm tra CSV cho xử lý chuỗi
  window_s: 2.0
  stride_s: 0.25
  kpt_conf_thres: 0.2
  max_missing: 0.4

classifier:                      # bộ phân loại ngã (src/classifier.py) — ST-GCN, LSTM... chọn theo "arch" trong checkpoint
  checkpoint: model_classify/shiftgcn_best_4_20_11.pt   # model mở web lên là dùng; null = không dùng model.
                                 # Đổi được ngay trên web (ô "Model"), chỉ chọn được các model trong "choices" dưới đây.
  threshold: null                # P(ngã) >= threshold -> NGÃ; null = ngưỡng chọn trên val lưu trong checkpoint (không có thì 0.5)
  stride_frames: 5               # dự đoán lại sau mỗi N khung
  window_size: null              # null = lấy từ checkpoint (mặc định 20 khung = 2 s @ 10 fps)
  device: null                   # null = cuda nếu có, không thì cpu
  speed_gate: null               # cổng tốc độ (src/motion.py): chỉ xác nhận NGÃ khi chuyển động đủ nhanh,
                                 # để nằm xuống / leo lên giường / ngả lưng chậm không bị báo ngã.
                                 # null = dùng giá trị lưu trong checkpoint (calibrate_gate.py --save), không có thì tắt.
                                 # Bật/tắt và chỉnh ngay trên web (ô "Cổng tốc độ"). Ví dụ đặt tay:
                                 # speed_gate: {enabled: true, shoulder_drop: 2.5, rotation: 200, keep_if_p_above: 0.95}
  choices:                       # CHỈ các model này hiện trên web (+ mục "Không dùng model"). Xóa cả mục = hiện mọi file.
                                 # Mỗi model ghi đè được threshold / stride_frames / postprocess / speed_gate ở trên.
    model_classify/shiftgcn_best_4_20_11.pt:
      label: ShiftGCN (nhánh final)
      threshold: 0.8             # FALL_THRESHOLD của nhánh final
      stride_frames: 1           # nhánh final dự đoán mỗi khung
      postprocess:               # thuật toán hậu xử lý của nhánh final (src/fall_postprocess.py); bật thì bỏ qua speed_gate
        enabled: true
        consec_frames: 1         # số khung liên tiếp P >= threshold (và qua cổng tốc độ) để báo NGÃ (final: 1).
                                 # KHÔNG để 3: ngã thật trên MaixCAM P chỉ vọt >= 0.8 trong 1-2 khung (0.81, 0.93, 0.52)
                                 # còn nằm xuống chậm P cao kéo dài -> 3 khung liên tiếp lọc NGƯỢC (bỏ ngã, giữ nằm).
        speed_gate:              # thêm so với final: chỉ KÍCH HOẠT khi cửa sổ 1.7 s có vai hạ >= shoulder_drop thân/s
          shoulder_drop: 2.0     # HOẶC thân xoay >= rotation độ/s (src/motion.py). Đo trên data/testsets/v1_lying:
          rotation: 200          # ngã thật vai hạ >= 2.93, nằm xuống chậm <= 1.42 -> giữ 82/82 video ngã,
                                 # video sinh hoạt báo nhầm 30 -> 1 / 118. null = tắt (đúng final).
        hold_frames: 10          # HOLD_FRAMES: giữ cảnh báo, chỉ nhả khi người đã đứng thẳng (thân + chân)
        min_valid_ratio: 0.5     # MIN_VALID_RATIO: cửa sổ có < 50% khung thấy người thì giữ P cũ, không dự đoán
        reset_empty_frames: 5    # mất người >= 5 khung liên tiếp -> xóa cửa sổ + trạng thái cảnh báo
        max_hold_frames: 100     # thêm so với final: đang giữ NGÃ mà P < ngưỡng liên tục 100 khung (10 s) thì nhả,
                                 # kể cả khi không thấy chân (camera chỉ thấy nửa trên -> bản final kẹt NGÃ mãi).
                                 # null = đúng hành vi final (chỉ nhả khi thấy người đứng thẳng cả thân + chân)
    models/b1_lstm.pt:
      label: B1 LSTM             # giữ tham số cũ: ngưỡng lưu trong checkpoint, dự đoán mỗi 5 khung

dataset:                         # run_web.py build-dataset / nút "Tạo dataset" -> output/<cấu hình>/dataset/windows.npz
  win_sec: 2.0                   # độ dài cửa sổ (2 s @ 10 fps = 20 khung, khớp classifier.window_size)
  stride_sec: 0.5
  min_overlap: 0.3               # cửa sổ chồng >= 30% đoạn [fall_start_s, fall_end_s] -> nhãn NGÃ
  min_valid_ratio: 0.0           # bỏ cửa sổ có tỉ lệ khung có người thấp hơn (0 = giữ hết)

monitor:                         # trang /monitor — giám sát nền, chạy kể cả khi không ai mở web
  source: null                   # maix://192.168.1.50 (MaixCAM chạy maixcam_app, pose trên NPU)
                                 # | rtsp://<IP>:8554/live (MaixCAM chỉ phát RTSP, PC chạy YOLO) | 0 (webcam PC)
  autostart: false               # true: mở server là giám sát luôn (cần source). Hoặc: python run_web.py --monitor maix://<IP>
  checkpoint: null               # null = dùng classifier.checkpoint ở trên

events:                          # lưu lại khoảnh khắc ngã để xem lại
  dir: output/fall_events        # chỉ giữ max_events event gần nhất
  saved_dir: output/fall_events_saved   # nút "Lưu vĩnh viễn" chuyển event sang đây (không bị xóa vòng)
  max_events: 5
  pre_s: 6                       # giây TRƯỚC cảnh báo (model báo trễ ~1-3 s so với lúc ngã thật)
  post_s: 5                      # giây SAU cảnh báo; cảnh báo mới trong lúc ghi -> kéo dài clip
  max_clip_s: 30                 # clip dài nhất
  cooldown_s: 20                 # sau một event, cảnh báo trong N giây không tạo event mới
  frame_width: 480               # thu nhỏ ảnh lưu (px) cho nhẹ đĩa
  jpeg_quality: 75
